# Ține proiectul Supabase (plan gratuit) treaz: o interogare la 3 zile.
# Necesită secrets în GitHub: SUPABASE_URL și SUPABASE_ANON_KEY.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sS -f "${{ secrets.SUPABASE_URL }}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
