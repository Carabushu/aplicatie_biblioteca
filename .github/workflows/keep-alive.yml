# Ține proiectul Supabase (plan gratuit) treaz: o interogare la 3 zile.
# Necesită secrets în GitHub: SUPABASE_URL și SUPABASE_ANON_KEY (cheia publishable).
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -sS "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o body.txt -w "%{http_code}")
          echo "HTTP $code"
          head -c 300 body.txt; echo
          echo "Lungime URL: ${#SUPABASE_URL}  Lungime cheie: ${#SUPABASE_ANON_KEY}  Prefix cheie: ${SUPABASE_ANON_KEY:0:15}"
          [ "$code" = "200" ]
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
